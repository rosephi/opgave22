<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farvegætteleg</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
  <h1>Farvegætteleg</h1>
  <p class="intro">Hej! Find det felt, der matcher RGB-koden.</p>

  <div class="target-code" id="targetCode">rgb(0, 0, 0)</div>

  <div class="swatches" id="swatches"></div>

  <div class="feedback" id="feedback"></div>

  <div class="stats">
    <div>Rigtige<strong id="statCorrect">0</strong></div>
    <div>Forsøg<strong id="statAttempts">0</strong></div>
    <div>Runde<strong id="statRound">1</strong></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
